name: Phase 01 Verification

on:
  push:
    branches:
      - phase-01-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Phase 01 foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Confirm pnpm
        run: pnpm --version

      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Phase 01 verification gate
        run: pnpm verify:phase01

      - name: Smoke-test vinext Worker
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --config dist/server/wrangler.json --port 8787 > "$RUNNER_TEMP/found-calc-wrangler.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/id > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/found-calc-wrangler.log"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8787/id > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8787/en > /dev/null

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-01-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: warn
          retention-days: 7
