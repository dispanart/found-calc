name: Phase 01 Verification

on:
  push:
    branches:
      - phase-01-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Phase 01 foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Confirm pnpm
        run: pnpm --version

      - name: Install dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
          else
            pnpm install --no-frozen-lockfile
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated dependency baseline
        if: steps.dependencies.outputs.bootstrapped == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml pnpm-workspace.yaml
          git commit -m "chore: lock Phase 01 dependencies"
          git push origin HEAD:phase-01-foundation

      - name: Require committed lockfile on pull requests
        if: steps.dependencies.outputs.bootstrapped == 'true' && github.event_name != 'push'
        run: |
          echo "pnpm-lock.yaml must be committed before Phase 01 can be verified."
          exit 1

      - name: Install Playwright Chromium
        if: steps.dependencies.outputs.bootstrapped != 'true'
        run: pnpm --filter @found-calc/web exec playwright install --with-deps chromium

      - name: Run Phase 01 verification gate
        if: steps.dependencies.outputs.bootstrapped != 'true'
        run: pnpm verify:phase01

      - name: Smoke-test vinext Worker
        if: steps.dependencies.outputs.bootstrapped != 'true'
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --config dist/server/wrangler.json --port 8787 > "$RUNNER_TEMP/found-calc-wrangler.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/id > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/found-calc-wrangler.log"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8787/id > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8787/en > /dev/null
