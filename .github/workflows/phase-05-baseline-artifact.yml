name: Phase 05 Canonical Baseline

on:
  push:
    branches:
      - main
    paths:
      - docs/verification/phase-05-verification.md
      - .github/workflows/phase-05-baseline-artifact.yml
      - tests/foundation/phase-05-verification-contract.test.mjs
      - docs/superpowers/specs/2026-08-29-found-calc-phase-05-versioned-rule-platform-admin-core-design.md
      - docs/superpowers/plans/2026-08-29-found-calc-phase-05-versioned-rule-platform-admin-core.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package exact Phase 05 merge baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create canonical archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="found-calc-phase-05-versioned-rule-platform-admin-core.zip"
          git archive --format=zip --output="$ARTIFACT" "$GITHUB_SHA"
          sha256sum "$ARTIFACT" > SHA256SUMS

      - name: Extract and verify portable baseline
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="found-calc-phase-05-versioned-rule-platform-admin-core.zip"
          VERIFY_DIR="$RUNNER_TEMP/found-calc-phase05-baseline"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$ARTIFACT" -d "$VERIFY_DIR"

          required=(
            "BASELINE.md"
            "PHASE_HANDOFF.md"
            "PHASE_CHAT_TEMPLATE.md"
            "package.json"
            "pnpm-lock.yaml"
            "pnpm-workspace.yaml"
            "scripts/verify-phase-05.mjs"
            ".github/workflows/phase-05-verification.yml"
            ".github/workflows/phase-05-baseline-artifact.yml"
            "docs/verification/phase-05-verification.md"
            "docs/superpowers/specs/2026-08-29-found-calc-phase-05-versioned-rule-platform-admin-core-design.md"
            "docs/superpowers/plans/2026-08-29-found-calc-phase-05-versioned-rule-platform-admin-core.md"
            "apps/web/migrations/0001_phase04_auth_and_calculator_state.sql"
            "apps/web/migrations/0002_phase05_rule_platform_admin.sql"
            "packages/rules/src/publication.ts"
            "packages/rules/src/publication.test.ts"
            "apps/web/src/lib/auth/server.ts"
            "apps/web/src/lib/rules/payload.ts"
            "apps/web/src/lib/rules/repository.ts"
            "apps/web/src/lib/rules/http.ts"
            "apps/web/src/lib/rules/client.ts"
            "apps/web/src/components/admin/rule-admin-panel.tsx"
            "apps/web/src/components/calculator/synthetic-rule-calculator.tsx"
            "apps/web/src/app/api/rules/[ruleId]/versions/route.ts"
            "apps/web/src/app/api/admin/rule-versions/route.ts"
            "apps/web/src/app/api/admin/rule-versions/[id]/publish/route.ts"
            "apps/web/tests/cloudflare/phase-05-rule-repository.test.ts"
            "apps/web/tests/cloudflare/phase-05-rule-api.test.ts"
            "apps/web/tests/e2e/phase-05-admin.spec.ts"
            "apps/web/tests/e2e/phase-05-rule-feed.spec.ts"
            "tests/foundation/phase-05-rule-platform-contract.test.mjs"
            "tests/foundation/phase-05-rule-storage-contract.test.mjs"
            "tests/foundation/phase-05-rule-api-contract.test.mjs"
            "tests/foundation/phase-05-rule-feed-contract.test.mjs"
            "tests/foundation/phase-05-admin-ui-contract.test.mjs"
            "tests/foundation/phase-05-verification-contract.test.mjs"
          )

          for path in "${required[@]}"; do
            test -f "$VERIFY_DIR/$path" || { echo "Missing required baseline file: $path" >&2; exit 1; }
          done

          if find "$VERIFY_DIR" -type d \( \
            -name node_modules -o \
            -name .next -o \
            -name dist -o \
            -name .wrangler -o \
            -name test-results -o \
            -name playwright-report \
          \) -print -quit | grep -q .; then
            echo "Generated/dependency directory leaked into canonical baseline." >&2
            exit 1
          fi

          source_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          archive_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          test "$source_tree" = "$archive_tree"

          {
            echo "artifact=$ARTIFACT"
            echo "source_commit=$GITHUB_SHA"
            echo "source_tree=$source_tree"
            echo "archive_tree=$archive_tree"
            echo "archive_sha256=$(cut -d' ' -f1 SHA256SUMS)"
            echo "required_files=${#required[@]}"
            echo "extraction_verification=PASS"
          } > ARTIFACT_VERIFICATION.txt

      - name: Upload canonical Phase 05 baseline
        uses: actions/upload-artifact@v4
        with:
          name: found-calc-phase-05-versioned-rule-platform-admin-core
          path: |
            found-calc-phase-05-versioned-rule-platform-admin-core.zip
            SHA256SUMS
            ARTIFACT_VERIFICATION.txt
          if-no-files-found: error
          retention-days: 90
