name: Phase 07B Canonical Baseline

on:
  push:
    branches:
      - main
    paths:
      - BASELINE.md
      - PHASE_HANDOFF.md
      - PHASE_CHAT_TEMPLATE.md
      - docs/verification/phase-07b-verification.md
      - .github/workflows/phase-07b-baseline-artifact.yml
      - tests/foundation/phase-07b-verification-contract.test.mjs

permissions:
  contents: read

jobs:
  package:
    name: Package exact Phase 07B merge baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create canonical archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="found-calc-phase-07b-widget-platform-foundation.zip"
          git archive --format=zip --output="$ARTIFACT" "$GITHUB_SHA"
          sha256sum "$ARTIFACT" > SHA256SUMS

      - name: Extract and verify portable baseline
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="found-calc-phase-07b-widget-platform-foundation.zip"
          VERIFY_DIR="$RUNNER_TEMP/found-calc-phase07b-baseline"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -tq "$ARTIFACT"
          unzip -q "$ARTIFACT" -d "$VERIFY_DIR"

          required=(
            "BASELINE.md"
            "PHASE_HANDOFF.md"
            "PHASE_CHAT_TEMPLATE.md"
            "package.json"
            "pnpm-lock.yaml"
            "pnpm-workspace.yaml"
            "scripts/verify-phase-07b.mjs"
            "scripts/smoke-phase-07b-worker.sh"
            ".github/workflows/phase-07b-verification.yml"
            ".github/workflows/phase-07b-baseline-artifact.yml"
            "docs/verification/phase-07a-verification.md"
            "docs/verification/phase-07b-verification.md"
            "docs/superpowers/specs/2026-08-31-found-calc-phase-07b-widget-platform-foundation-design.md"
            "docs/superpowers/plans/2026-08-31-found-calc-phase-07b-widget-platform-foundation-implementation-plan.md"
            "apps/web/.dev.vars.example"
            "apps/web/migrations/0006_phase07b_widget_platform.sql"
            "apps/web/public/embed.js"
            "apps/web/src/proxy.ts"
            "apps/web/src/app/embed/[publicWidgetKey]/page.tsx"
            "apps/web/src/lib/widgets/contracts.ts"
            "apps/web/src/lib/widgets/domain.ts"
            "apps/web/src/lib/widgets/verification.ts"
            "apps/web/src/lib/widgets/security.ts"
            "apps/web/src/lib/widgets/runtime.ts"
            "apps/web/src/lib/widgets/protocol.ts"
            "apps/web/src/lib/widgets/widget-repository.ts"
            "apps/web/src/lib/widgets/domain-repository.ts"
            "apps/web/src/lib/widgets/analytics-repository.ts"
            "apps/web/tests/cloudflare/phase-07b-migration.test.ts"
            "apps/web/tests/cloudflare/phase-07b-widget-api.test.ts"
            "apps/web/tests/cloudflare/phase-07b-widget-repository.test.ts"
            "apps/web/tests/e2e/phase-07b-widget-runtime.spec.ts"
            "apps/web/tests/e2e/phase-07b-widget-accessibility.spec.ts"
            "apps/web/tests/e2e/phase-07b-widget-management.spec.ts"
            "tests/foundation/phase-07b-verification-contract.test.mjs"
          )

          for path in "${required[@]}"; do
            test -f "$VERIFY_DIR/$path" || { echo "Missing required Phase 07B baseline file: $path" >&2; exit 1; }
          done

          leaked_dir="$(find "$VERIFY_DIR" -type d \( -name node_modules -o -name .next -o -name dist -o -name .wrangler -o -name test-results -o -name playwright-report -o -name .open-next \) -print -quit)"
          if [[ -n "$leaked_dir" ]]; then
            echo "Generated/dependency directory leaked into canonical baseline: $leaked_dir" >&2
            exit 1
          fi

          if find "$VERIFY_DIR" -type f \( -name '.dev.vars' -o -name '.env' -o -name '.env.local' \) -print -quit | grep -q .; then
            echo "Secret-bearing local environment file leaked into canonical baseline" >&2
            exit 1
          fi

          source_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          archive_sha256="$(cut -d' ' -f1 SHA256SUMS)"

          {
            echo "artifact=$ARTIFACT"
            echo "source_commit=$GITHUB_SHA"
            echo "source_tree=$source_tree"
            echo "archive_provenance=git-archive-exact-github-sha"
            echo "archive_sha256=$archive_sha256"
            echo "zip_integrity=PASS"
            echo "required_files=${#required[@]}"
            echo "extraction_verification=PASS"
            echo "secret_file_check=PASS"
          } > ARTIFACT_VERIFICATION.txt

      - name: Upload canonical Phase 07B baseline
        uses: actions/upload-artifact@v4
        with:
          name: found-calc-phase-07b-widget-platform-foundation
          path: |
            found-calc-phase-07b-widget-platform-foundation.zip
            SHA256SUMS
            ARTIFACT_VERIFICATION.txt
          if-no-files-found: error
          retention-days: 90
