name: Phase 07A Canonical Baseline

on:
  push:
    branches:
      - main
    paths:
      - BASELINE.md
      - PHASE_HANDOFF.md
      - PHASE_CHAT_TEMPLATE.md
      - docs/verification/phase-07a-verification.md
      - .github/workflows/phase-07a-baseline-artifact.yml
      - tests/foundation/phase-07a-verification-contract.test.mjs

permissions:
  contents: read

jobs:
  package:
    name: Package exact Phase 07A merge baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create canonical archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="found-calc-phase-07a-commercial-auth-amendment.zip"
          git archive --format=zip --output="$ARTIFACT" "$GITHUB_SHA"
          sha256sum "$ARTIFACT" > SHA256SUMS

      - name: Extract and verify portable baseline
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="found-calc-phase-07a-commercial-auth-amendment.zip"
          VERIFY_DIR="$RUNNER_TEMP/found-calc-phase07a-baseline"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -tq "$ARTIFACT"
          unzip -q "$ARTIFACT" -d "$VERIFY_DIR"

          required=(
            "BASELINE.md"
            "PHASE_HANDOFF.md"
            "PHASE_CHAT_TEMPLATE.md"
            "package.json"
            "pnpm-lock.yaml"
            "pnpm-workspace.yaml"
            "scripts/verify-phase-07.mjs"
            "scripts/verify-phase-07a.mjs"
            "scripts/smoke-phase-07-worker.sh"
            ".github/workflows/phase-07a-verification.yml"
            ".github/workflows/phase-07a-baseline-artifact.yml"
            "docs/verification/phase-07-verification.md"
            "docs/verification/phase-07a-verification.md"
            "docs/superpowers/specs/2026-08-30-found-calc-phase-07a-commercial-trial-google-auth-design.md"
            "docs/superpowers/plans/2026-08-30-found-calc-phase-07a-commercial-trial-google-auth-implementation-plan.md"
            "apps/web/.dev.vars.example"
            "apps/web/migrations/0004_phase07_billing.sql"
            "apps/web/migrations/0005_phase07a_commercial_auth_amendment.sql"
            "apps/web/src/lib/auth/google-config.ts"
            "apps/web/src/lib/auth/redirect.ts"
            "apps/web/src/lib/auth/server.ts"
            "apps/web/src/lib/billing/commercial.ts"
            "apps/web/src/lib/billing/contracts.ts"
            "apps/web/src/lib/billing/plans.ts"
            "apps/web/src/lib/billing/entitlements.ts"
            "apps/web/src/lib/billing/repository.ts"
            "apps/web/src/lib/billing/http.ts"
            "apps/web/src/lib/billing/trial-http.ts"
            "apps/web/src/lib/billing/capabilities.ts"
            "apps/web/src/lib/persistence/limited-repository.ts"
            "apps/web/src/lib/workspace/limited-repository.ts"
            "apps/web/src/lib/workspace/commercial-http.ts"
            "apps/web/src/components/auth/auth-panel.tsx"
            "apps/web/src/components/billing/billing-panel.tsx"
            "apps/web/src/components/billing/pricing-panel.tsx"
            "apps/web/src/app/[locale]/(public)/pricing/page.tsx"
            "apps/web/src/app/api/billing/trial/route.ts"
            "apps/web/tests/cloudflare/phase-07a-migration.test.ts"
            "apps/web/tests/cloudflare/phase-07a-trial-repository.test.ts"
            "apps/web/tests/cloudflare/phase-07a-cancellation-paid-through.test.ts"
            "apps/web/tests/cloudflare/phase-07a-commercial-limits.test.ts"
            "apps/web/tests/e2e/phase-07a-google-auth.spec.ts"
            "apps/web/tests/e2e/phase-07a-pricing.spec.ts"
            "tests/foundation/phase-07a-google-auth-contract.test.mjs"
            "tests/foundation/phase-07a-google-transition-contract.test.mjs"
            "tests/foundation/phase-07a-commercial-limits-contract.test.mjs"
            "tests/foundation/phase-07a-pricing-contract.test.mjs"
            "tests/foundation/phase-07a-verification-contract.test.mjs"
          )

          for path in "${required[@]}"; do
            test -f "$VERIFY_DIR/$path" || { echo "Missing required Phase 07A baseline file: $path" >&2; exit 1; }
          done

          leaked_dir="$(find "$VERIFY_DIR" -type d \( -name node_modules -o -name .next -o -name dist -o -name .wrangler -o -name test-results -o -name playwright-report \) -print -quit)"
          if [[ -n "$leaked_dir" ]]; then
            echo "Generated/dependency directory leaked into canonical baseline: $leaked_dir" >&2
            exit 1
          fi

          if find "$VERIFY_DIR" -type f \( -name '.dev.vars' -o -name '.env' -o -name '.env.local' \) -print -quit | grep -q .; then
            echo "Secret-bearing local environment file leaked into canonical baseline" >&2
            exit 1
          fi

          source_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          archive_sha256="$(cut -d' ' -f1 SHA256SUMS)"

          {
            echo "artifact=$ARTIFACT"
            echo "source_commit=$GITHUB_SHA"
            echo "source_tree=$source_tree"
            echo "archive_provenance=git-archive-exact-github-sha"
            echo "archive_sha256=$archive_sha256"
            echo "zip_integrity=PASS"
            echo "required_files=${#required[@]}"
            echo "extraction_verification=PASS"
            echo "secret_file_check=PASS"
          } > ARTIFACT_VERIFICATION.txt

      - name: Upload canonical Phase 07A baseline
        uses: actions/upload-artifact@v4
        with:
          name: found-calc-phase-07a-commercial-auth-amendment
          path: |
            found-calc-phase-07a-commercial-auth-amendment.zip
            SHA256SUMS
            ARTIFACT_VERIFICATION.txt
          if-no-files-found: error
          retention-days: 90
