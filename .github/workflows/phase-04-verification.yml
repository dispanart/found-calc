name: Phase 04 Verification

on:
  push:
    branches:
      - phase-04-persistence-auth-guest-preservation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Phase 04 persistence and auth
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BETTER_AUTH_SECRET: phase-04-ci-test-secret-not-for-production-000000000000000000000000
      BETTER_AUTH_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Confirm pnpm
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @found-calc/web exec playwright install --with-deps chromium
      - name: Apply local Phase 04 D1 migration
        working-directory: apps/web
        run: pnpm exec wrangler d1 execute found-calc-local --local --file migrations/0001_phase04_auth_and_calculator_state.sql --yes
      - name: Run Phase 04 verification gate
        run: pnpm verify:phase04
      - name: Smoke-test built vinext Worker
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute found-calc-local --local --file migrations/0001_phase04_auth_and_calculator_state.sql --yes
          pnpm exec wrangler dev --config dist/server/wrangler.json --port 8787 --var BETTER_AUTH_SECRET:"$BETTER_AUTH_SECRET" --var BETTER_AUTH_URL:http://127.0.0.1:8787 > "$RUNNER_TEMP/found-calc-phase04-wrangler.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/id > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/found-calc-phase04-wrangler.log"; exit 1; fi
          for route in /id /en /id/calculators /id/calculators/discount /id/auth /en/auth; do
            curl --fail --silent --show-error "http://127.0.0.1:8787${route}" > /dev/null
          done
          curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8787/api/calculator-state/reference.discount | grep -Eq '^(200|401|404)$'
