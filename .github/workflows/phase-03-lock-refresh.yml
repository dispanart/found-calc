name: Phase 03 Lockfile Refresh

on:
  push:
    branches:
      - phase-03-product-ui-runtime-discovery
    paths:
      - packages/catalog/package.json
      - apps/web/package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh pnpm lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-03-product-ui-runtime-discovery
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit canonical lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh Phase 03 lockfile"
          git push origin HEAD:phase-03-product-ui-runtime-discovery
