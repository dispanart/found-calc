name: Phase 07B Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-07b-${{ github.ref }}
  cancel-in-progress: true

env:
  BETTER_AUTH_SECRET: phase-07b-ci-test-secret-not-for-production-00000000000000000000000
  BETTER_AUTH_URL: http://127.0.0.1:3000
  BETTER_AUTH_ADMIN_USER_IDS: phase-07b-ci-admin-bootstrap
  GOOGLE_CLIENT_ID: phase-07b-google-client-id-placeholder
  GOOGLE_CLIENT_SECRET: phase-07b-google-client-secret-placeholder
  BILLING_PLANS_JSON: '[{"id":"pro-monthly","displayName":{"id":"Pro","en":"Pro"},"description":{"id":"Konfigurasi verifikasi Pro","en":"Pro verification configuration"},"amount":25000,"currency":"IDR","country":"ID","interval":"MONTH","intervalCount":1,"billingDay":15,"totalRecurrence":null,"failedCycleAction":"RESUME","entitlements":["advanced_scenarios","history_depth"]},{"id":"pro-annual","displayName":{"id":"Pro","en":"Pro"},"description":{"id":"Konfigurasi verifikasi Pro","en":"Pro verification configuration"},"amount":250000,"currency":"IDR","country":"ID","interval":"MONTH","intervalCount":12,"billingDay":15,"totalRecurrence":null,"failedCycleAction":"RESUME","entitlements":["advanced_scenarios","history_depth"]},{"id":"business-monthly","displayName":{"id":"Business","en":"Business"},"description":{"id":"Konfigurasi verifikasi Business","en":"Business verification configuration"},"amount":75000,"currency":"IDR","country":"ID","interval":"MONTH","intervalCount":1,"billingDay":15,"totalRecurrence":null,"failedCycleAction":"RESUME","entitlements":["advanced_scenarios","history_depth","bulk_sku","export","team_access"]},{"id":"business-annual","displayName":{"id":"Business","en":"Business"},"description":{"id":"Konfigurasi verifikasi Business","en":"Business verification configuration"},"amount":750000,"currency":"IDR","country":"ID","interval":"MONTH","intervalCount":12,"billingDay":15,"totalRecurrence":null,"failedCycleAction":"RESUME","entitlements":["advanced_scenarios","history_depth","bulk_sku","export","team_access"]},{"id":"pro-monthly-2026a","displayName":{"id":"Besties","en":"Besties"},"description":{"id":"Besties bulanan","en":"Monthly Besties"},"amount":24900,"currency":"IDR","country":"ID","interval":"MONTH","intervalCount":1,"billingDay":15,"totalRecurrence":null,"failedCycleAction":"RESUME","entitlements":["advanced_scenarios","history_depth"]},{"id":"pro-annual-2026a","displayName":{"id":"Besties","en":"Besties"},"description":{"id":"Besties tahunan","en":"Annual Besties"},"amount":199000,"currency":"IDR","country":"ID","interval":"MONTH","intervalCount":12,"billingDay":15,"totalRecurrence":null,"failedCycleAction":"RESUME","entitlements":["advanced_scenarios","history_depth"]},{"id":"business-monthly-2026a","displayName":{"id":"Family","en":"Family"},"description":{"id":"Family bulanan","en":"Monthly Family"},"amount":59000,"currency":"IDR","country":"ID","interval":"MONTH","intervalCount":1,"billingDay":15,"totalRecurrence":null,"failedCycleAction":"RESUME","entitlements":["advanced_scenarios","history_depth","bulk_sku","export","team_access"]},{"id":"business-annual-2026a","displayName":{"id":"Family","en":"Family"},"description":{"id":"Family tahunan","en":"Annual Family"},"amount":499000,"currency":"IDR","country":"ID","interval":"MONTH","intervalCount":12,"billingDay":15,"totalRecurrence":null,"failedCycleAction":"RESUME","entitlements":["advanced_scenarios","history_depth","bulk_sku","export","team_access"]}]'
  PUBLIC_APP_ORIGIN: http://127.0.0.1:3000
  XENDIT_SECRET_API_KEY: phase-07b-provider-secret-test-only
  XENDIT_WEBHOOK_TOKEN: phase-07b-webhook-token-test-only-000000
  CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
  FOUNDCALC_EMBED_ORIGIN: http://localhost:8787
  FOUNDCALC_WIDGET_LOCAL_PORTS: 3000,3101,3102

jobs:
  verify:
    name: Verify Phase 07B widget platform and inherited boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Confirm pnpm
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @found-calc/web exec playwright install --with-deps chromium
      - name: Reset and apply local D1 migrations
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wrangler/state
          pnpm exec wrangler d1 execute found-calc-local --local --file migrations/0001_phase04_auth_and_calculator_state.sql --yes
          pnpm exec wrangler d1 execute found-calc-local --local --file migrations/0002_phase05_rule_platform_admin.sql --yes
          pnpm exec wrangler d1 execute found-calc-local --local --file migrations/0003_phase06_workspace.sql --yes
          pnpm exec wrangler d1 execute found-calc-local --local --file migrations/0004_phase07_billing.sql --yes
          pnpm exec wrangler d1 execute found-calc-local --local --file migrations/0005_phase07a_commercial_auth_amendment.sql --yes
          pnpm exec wrangler d1 execute found-calc-local --local --file migrations/0006_phase07b_widget_platform.sql --yes
      - name: Run Phase 07B verification gate
        run: pnpm verify:phase07b

  worker-smoke:
    name: Smoke-test built vinext Worker Phase 07B embed isolation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Confirm pnpm
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build vinext Worker
        run: pnpm --filter @found-calc/web build:vinext
      - name: Run deterministic Phase 07B Worker smoke
        shell: bash
        run: bash scripts/smoke-phase-07b-worker.sh
