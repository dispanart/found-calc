name: Phase 04 Lockfile Refresh

on:
  push:
    branches:
      - phase-04-persistence-auth-guest-preservation

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-04-persistence-auth-guest-preservation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Refresh lockfile with pnpm
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh Phase 04 lockfile [skip ci]"
          git push origin HEAD:phase-04-persistence-auth-guest-preservation
